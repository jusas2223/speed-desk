spring.datasource.url=${SPEEDDESK_DB_URL}
spring.datasource.username=${SPEEDDESK_DB_USERNAME}
spring.datasource.password=${SPEEDDESK_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

speeddesk.jwt.secret=${SPEEDDESK_JWT_SECRET}
speeddesk.jwt.expiration-seconds=${SPEEDDESK_JWT_EXPIRATION_SECONDS:3600}
speeddesk.jwt.issuer=speed-desk-api
speeddesk.cors.allowed-origins=${SPEEDDESK_CORS_ALLOWED_ORIGINS}
speeddesk.account.password-reset-expiration-minutes=${SPEEDDESK_PASSWORD_RESET_EXPIRATION_MINUTES:30}
speeddesk.rate-limit.enabled=${SPEEDDESK_RATE_LIMIT_ENABLED:true}
speeddesk.rate-limit.authenticated-requests-per-minute=${SPEEDDESK_AUTHENTICATED_REQUESTS_PER_MINUTE:180}
speeddesk.rate-limit.public-requests-per-minute=${SPEEDDESK_PUBLIC_REQUESTS_PER_MINUTE:20}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.document-title=Speed Desk API
