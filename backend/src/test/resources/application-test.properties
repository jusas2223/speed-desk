spring.datasource.url=jdbc:h2:mem:speeddesk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

speeddesk.jwt.secret=test-only-speeddesk-secret-with-at-least-32-bytes
speeddesk.jwt.expiration-seconds=3600
speeddesk.jwt.issuer=speed-desk-api
speeddesk.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500
