<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Speed Desk</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Sobrescrevendo o flex do body que centralizava o login */
        body {
            display: flex;
            justify-content: flex-start;
            align-items: stretch;
            background-color: var(--background-color);
        }

        /* Menu Lateral */
        .sidebar {
            width: 250px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            padding: var(--spacing-lg);
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: var(--spacing-xl);
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            flex-grow: 1;
        }

        .sidebar-menu li {
            margin-bottom: var(--spacing-md);
        }

        .sidebar-menu a {
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            display: block;
            padding: var(--spacing-sm) 0;
            transition: color 0.2s;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            color: var(--primary-color);
        }

        /* Área Principal */
        .main-content {
            flex-grow: 1;
            padding: var(--spacing-xl);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
        }

        .dashboard-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
        }

        /* Kanban Board */
        .kanban-board {
            display: flex;
            gap: var(--spacing-lg);
            flex-grow: 1;
            overflow-x: auto;
            padding-bottom: var(--spacing-md);
        }

        .kanban-column {
            flex: 1;
            min-width: 300px;
            background-color: #f9f9f9;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: var(--spacing-md);
        }

        /* Dark mode nativo kanban */
        @media (prefers-color-scheme: dark) {
            .kanban-column {
                background-color: #1c1c1c;
            }
        }

        .kanban-column-header {
            font-weight: 600;
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .col-novos .kanban-column-header { border-color: var(--primary-color); }
        .col-andamento .kanban-column-header { border-color: #f1c21b; }
        .col-concluidos .kanban-column-header { border-color: #24a148; }

        .kanban-cards {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            padding-right: 4px;
        }

        /* Card do Ticket */
        .ticket-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: var(--spacing-md);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .ticket-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .ticket-title {
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            font-size: 0.95rem;
        }

        .ticket-client {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }

        .ticket-badges {
            display: flex;
            gap: var(--spacing-xs);
            margin-top: var(--spacing-sm);
        }

        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .badge.p-alta { background-color: #ffe7e7; color: #da1e28; }
        .badge.p-media { background-color: #fdf6e3; color: #f1c21b; }
        .badge.p-baixa { background-color: #e5f6e6; color: #24a148; }
        .badge-status { background-color: var(--border-color); color: var(--text-secondary); }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--surface-color);
            padding: var(--spacing-xl);
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <nav class="sidebar">
        <div class="sidebar-logo">Speed Desk</div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html" class="active">Painel Kanban</a></li>
            <li><a href="#">Meus Chamados</a></li>
            <li><a href="assets.html">Meus Equipamentos</a></li>
            <li><a href="#">Configurações</a></li>
        </ul>
        <div style="margin-top: auto;">
            <button id="logoutBtn" class="btn" style="background:none; border:1px solid var(--border-color); color:var(--text-primary);">Sair</button>
        </div>
    </nav>

    <!-- Área Principal -->
    <main class="main-content">
        <header class="dashboard-header">
            <div>
                <h1>Painel de Controle</h1>
                <p id="welcomeMessage" style="color: var(--text-secondary); font-size: 0.9rem;">Carregando...</p>
            </div>
            <div>
                <button id="btnOpenModal" class="btn btn-primary">+ Abrir Chamado</button>
            </div>
        </header>

        <!-- Kanban Board -->
        <div class="kanban-board">
            
            <!-- Coluna Novos -->
            <div class="kanban-column col-novos">
                <div class="kanban-column-header">
                    <span>Novos</span>
                    <span id="count-novos" class="badge badge-status">0</span>
                </div>
                <div class="kanban-cards" id="col-novos-cards">
                    <!-- Cards dinâmicos aqui -->
                </div>
            </div>

            <!-- Coluna Em Andamento -->
            <div class="kanban-column col-andamento">
                <div class="kanban-column-header">
                    <span>Em Andamento</span>
                    <span id="count-andamento" class="badge badge-status">0</span>
                </div>
                <div class="kanban-cards" id="col-andamento-cards">
                    <!-- Cards dinâmicos aqui -->
                </div>
            </div>

            <!-- Coluna Concluídos -->
            <div class="kanban-column col-concluidos">
                <div class="kanban-column-header">
                    <span>Concluídos</span>
                    <span id="count-concluidos" class="badge badge-status">0</span>
                </div>
                <div class="kanban-cards" id="col-concluidos-cards">
                    <!-- Cards dinâmicos aqui -->
                </div>
            </div>
            
        </div>
    </main>

    <!-- Modal Novo Chamado -->
    <div class="modal-overlay" id="newTicketModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Abrir Novo Chamado</h2>
                <button class="modal-close" id="btnCloseModal">&times;</button>
            </div>
            <form id="newTicketForm">
                <div class="form-group">
                    <label for="titulo" class="form-label">Título</label>
                    <input type="text" id="titulo" class="form-control" required placeholder="Resumo do problema">
                </div>
                <div class="form-group">
                    <label for="descricao" class="form-label">Descrição</label>
                    <textarea id="descricao" class="form-control" required rows="4" placeholder="Detalhes da solicitação..."></textarea>
                </div>
                <div class="form-group">
                    <label for="assetSelect" class="form-label">Equipamento (Opcional)</label>
                    <select id="assetSelect" class="form-control">
                        <option value="">Nenhum / Não listado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="prioridade" class="form-label">Prioridade</label>
                    <select id="prioridade" class="form-control" required>
                        <option value="BAIXA">Baixa</option>
                        <option value="MEDIA">Média</option>
                        <option value="ALTA">Alta</option>
                        <option value="URGENTE">Urgente</option>
                    </select>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn" id="btnCancelModal" style="background:none; border:1px solid var(--border-color); color:var(--text-primary); width:auto;">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSubmitTicket" style="width:auto;">Salvar Chamado</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Lógica Vanilla JS -->
    <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
