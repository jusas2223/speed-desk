<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Notificações do Speed Desk.">
    <title>Notificações — Speed Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260822.1">
    <script>(()=>{const t=localStorage.getItem('speeddesk-theme');const v=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=v;document.documentElement.style.colorScheme=v;})();</script>
</head>
<body>
    <div class="velocity-background" aria-hidden="true"><div class="velocity-lines"></div></div>
    <div class="app-shell"><aside class="sidebar" id="sidebar-container"></aside><div class="main-column">
        <header class="topbar"><div class="topbar-start"><button id="mobileMenuBtn" class="icon-button mobile-menu-button" type="button" aria-label="Abrir menu"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button><span class="topbar-context">Central pessoal</span></div><div class="topbar-actions"><button class="icon-button notification-button" type="button" aria-label="Notificações"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg><span class="notification-dot"></span></button><button id="toggleThemeBtn" class="icon-button" type="button" aria-label="Alternar tema"><svg class="icon theme-icon theme-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg><svg class="icon theme-icon theme-icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button><div class="topbar-profile"><span class="user-avatar" data-topbar-avatar></span><span class="topbar-user-copy"><span class="topbar-user-name" data-topbar-name>Usuário</span><span class="topbar-user-status">Sessão ativa</span></span></div></div></header>
        <main class="content"><header class="page-heading"><div class="page-heading-main"><div class="page-title-row"><h1 class="page-title">Notificações</h1><span id="unreadBadge" class="live-badge">0 não lidas</span></div><p class="page-description">Acompanhe movimentações importantes dos chamados e da operação.</p></div><button id="markAllRead" class="btn btn-secondary" type="button">Marcar todas como lidas</button></header>
            <div id="notificationStatus" class="list-status loading" role="status">Carregando notificações...</div>
            <section id="notificationList" class="notification-list page-card" aria-live="polite" aria-busy="true"></section>
        </main>
    </div></div>
    <script type="module" src="js/navigation.js?v=20260822.1"></script><script type="module" src="js/notificacoes.js?v=20260822.1"></script>
</body></html>
