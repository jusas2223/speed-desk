<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalhes de um chamado do Speed Desk.">
    <title>Detalhes do chamado — Speed Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260821.4">
    <script>
        (() => {
            const savedTheme = localStorage.getItem('speeddesk-theme');
            const preferredTheme = savedTheme === 'light' || savedTheme === 'dark'
                ? savedTheme
                : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.dataset.theme = preferredTheme;
            document.documentElement.style.colorScheme = preferredTheme;
        })();
    </script>
</head>
<body>
    <div class="velocity-background" aria-hidden="true">
        <div class="velocity-lines"></div>
    </div>

    <div class="app-shell">
        <aside class="sidebar" id="sidebar-container"></aside>

        <div class="main-column">
            <header class="topbar">
                <div class="topbar-start">
                    <button id="mobileMenuBtn" class="icon-button mobile-menu-button" type="button" aria-label="Abrir menu" aria-expanded="false">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>

                    <div class="topbar-context">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 18l-6-6 6-6M3 12h18"></path>
                        </svg>
                        <span>Detalhes do chamado</span>
                    </div>
                </div>

                <div class="topbar-actions">
                    <button id="toggleThemeBtn" class="icon-button" type="button" aria-label="Alternar tema claro e escuro">
                        <svg class="icon theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
                        </svg>
                        <svg class="icon theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>

                    <div class="topbar-profile">
                        <span class="user-avatar" data-topbar-avatar></span>
                        <span class="topbar-user-copy">
                            <span class="topbar-user-name" data-topbar-name>Usuário</span>
                            <span class="topbar-user-status">Sessão ativa</span>
                        </span>
                    </div>
                </div>
            </header>

            <main class="content">
                <nav class="detail-toolbar" aria-label="Navegação dos detalhes">
                    <a class="btn btn-secondary btn-compact" href="chamados.html">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
                        Voltar aos chamados
                    </a>
                </nav>

                <div id="ticketDetail" class="ticket-detail-root" aria-live="polite" aria-busy="true">
                    <section class="page-card detail-state-card">
                        <div class="loading-state">Carregando detalhes do chamado...</div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <div id="ticketActionModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="ticketActionTitle" aria-describedby="ticketActionDescription" aria-hidden="true" inert hidden>
        <div class="modal-content modal-content-compact">
            <div class="modal-header">
                <h2 id="ticketActionTitle">Confirmar ação</h2>
                <button id="closeTicketActionModal" class="modal-close" type="button" aria-label="Fechar">&times;</button>
            </div>
            <p id="ticketActionDescription" class="modal-description"></p>
            <div id="ticketPauseReasonField" class="form-group ticket-pause-reason" hidden>
                <label for="ticketPauseReason" class="form-label">Motivo da pausa</label>
                <textarea id="ticketPauseReason" class="form-control" rows="4" maxlength="500" placeholder="Explique por que o SLA deve ser pausado."></textarea>
                <span class="field-hint">Obrigatório, com no máximo 500 caracteres.</span>
            </div>
            <div id="ticketActionFeedback" class="feedback" role="alert" aria-live="assertive" hidden></div>
            <div class="modal-actions">
                <button id="cancelTicketAction" class="btn btn-secondary" type="button">Cancelar</button>
                <button id="confirmTicketAction" class="btn btn-primary" type="button">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="ticketToastRegion" class="toast-region" role="status" aria-live="polite"></div>

    <script type="module" src="js/navigation.js?v=20260821.3"></script>
    <script type="module" src="js/chamado.js?v=20260821.4"></script>
</body>
</html>
